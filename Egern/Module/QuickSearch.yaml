name: QuickSearch
description: Safari快捷搜索(需要把Safari的搜索引擎设置为：DuckDuckGo)
compat_arguments:
  百度: www.baidu.com
compat_arguments_desc: |-
  网页版:www.baidu.com
  手机版:m.baidu.com
dns: {}
url_rewrites:
- match: ^https:\/\/duckduckgo.com\/\?q=yd\+([^&]+).+
  location: http://dict.youdao.com/search?q=$1
  status_code: 302
- match: ^https:\/\/duckduckgo.com\/\?q=trc\+([^&]+).+
  location: https://translate.google.com/#view=home&op=translate&sl=auto&tl=zh-CN&text=$1
  status_code: 302
