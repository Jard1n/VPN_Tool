dns:
  # DNS 引导器：用于解析上游DNS(DoT、DoH、DoQ)
  bootstrap:
  - 223.5.5.5
  - 119.29.29.29
  - system
  
  # 代理 DNS 的强制上游
  # proxy_nameservers:
  # - 119.29.29.29
  # - 223.5.5.5
  
  # DNS 服务器组
  upstreams:
    Domestic-DNS:
    - 223.5.5.5
    - 119.29.29.29
    Foreign-DNS:
      - https://8.8.8.8/dns-query
      - https://8.8.4.4/dns-query

  # DNS 转发规则
  # forward:
  #   - domain_suffix:
  #       match: "cn"
  #       value: bootstrap
  #   - wildcard:
  #       match: '*.cn'
  #       value: bootstrap
  #   - wildcard:
  #       match: '*'
  #       value: ChinaDNS

  # 主机映射
  hosts:
    iosapps.itunes.apple.com: 
    - iosapps.itunes.apple.com.download.ks-cdn.com

  # 屏蔽IP
  block_ips:
    - 4.3.2.1/32
  # 公网IP查询地址
  public_ip_lookup_url: https://ifconfig.me/ip

